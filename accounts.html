<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>アカウント管理 — マツイノカヌレ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  /* ── tokens ── */
  :root {
    --bg: #0e0d0b;
    --surface: #1a1916;
    --surface2: #222119;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);
    --gold-pale: rgba(201,168,76,0.06);
    --text: #e8e3d8;
    --text2: #9e9a8e;
    --text3: #5e5c56;
    --danger: #c0614a;
    --green: #5a9c72;
    --font-serif: 'Noto Serif JP', serif;
    --font-mono: 'DM Mono', monospace;
    --r: 10px;
    --r-lg: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-serif);
    min-height: 100dvh;
  }  /* ── main app ── */
  #app { display: none; }
  #app.visible { display: block; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(14,13,11,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  .app-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .app-logo {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .lock-out-btn {
    font-size: 11px;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font-serif);
  }
  .search-wrap {
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    font-size: 14px;
    font-family: var(--font-serif);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--border2); }
  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }

  .list-area {
    padding: 14px 14px 100px;
  }

  .category-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--text3);
    text-transform: uppercase;
    padding: 10px 4px 6px;
  }

  /* ── card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card.open { border-color: var(--border2); }

  .card-head {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .icon-pill {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--gold-pale);
    border: 1px solid rgba(201,168,76,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 500;
    color: var(--gold);
    flex-shrink: 0;
    font-family: var(--font-mono);
  }

  .card-meta { flex: 1; min-width: 0; }
  .card-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-url {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
    font-family: var(--font-mono);
  }

  .badge-2fa {
    font-size: 9px;
    letter-spacing: 0.06em;
    background: rgba(90,156,114,0.15);
    color: var(--green);
    border: 1px solid rgba(90,156,114,0.3);
    border-radius: 4px;
    padding: 2px 6px;
    flex-shrink: 0;
    font-family: var(--font-mono);
  }

  .chevron {
    color: var(--text3);
    flex-shrink: 0;
    transition: transform 0.22s ease;
  }
  .card.open .chevron { transform: rotate(90deg); }

  /* ── card body ── */
  .card-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 10px 14px 14px;
  }
  .card.open .card-body { display: block; }

  .field {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .field:last-of-type { border-bottom: none; }
  .field-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    min-width: 60px;
    flex-shrink: 0;
  }
  .field-val {
    font-size: 13px;
    color: var(--text);
    flex: 1;
    word-break: break-all;
    font-family: var(--font-mono);
  }
  .field-val.serif { font-family: var(--font-serif); font-size: 13px; }
  .field-val.note { color: var(--text2); font-family: var(--font-serif); font-size: 12px; line-height: 1.6; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    padding: 4px;
    display: flex;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .icon-btn:active { color: var(--gold); }

  .copy-btn {
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text3);
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 8px;
    cursor: pointer;
    font-family: var(--font-mono);
    flex-shrink: 0;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .copy-btn.copied {
    color: var(--green);
    border-color: rgba(90,156,114,0.3);
    background: rgba(90,156,114,0.08);
  }

  .pw-row { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .pw-text { flex: 1; word-break: break-all; }

  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .action-btn {
    flex: 1;
    padding: 8px;
    font-size: 12px;
    font-family: var(--font-serif);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text2);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .action-btn:active { opacity: 0.7; }
  .action-btn.del { color: var(--danger); }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1510;
    border: none;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(201,168,76,0.35);
    z-index: 60;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s, opacity 0.15s;
  }
  .fab:active { transform: scale(0.93); opacity: 0.9; }  /* ── empty ── */
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
    font-size: 13px;
  }
  .empty-state p { margin-top: 8px; line-height: 1.7; }

  /* ── animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.25s ease both; }
</style>
</head>
<body>

<!-- ════ MAIN APP ════ -->

    <div class="search-wrap">

</div>

// ── render ──
function initial(name) { return (name || "?").charAt(0).toUpperCase(); }

function render() {
  const q = (document.getElementById("search").value || "").toLowerCase();
  const filtered = q ? data.filter(e => e.name.toLowerCase().includes(q)) : data;
  const list = document.getElementById("list");

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5e5c56" stroke-width="1.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><p>${q ? "見つかりませんでした" : "まだ登録がありません<br>+ から追加できます"}</p></div>`;
    return;
  }

  list.innerHTML = filtered.map((e, i) => `
    <div class="card" id="card-${e.id}" style="animation-delay:${i * 0.04}s">
      <div class="card-head" onclick="toggle('${e.id}')">
        <div class="icon-pill">${initial(e.name)}</div>
        <div class="card-meta">
          <div class="card-name">${esc(e.name)}</div>
          ${e.url ? `<div class="card-url">${esc(e.url.replace(/^https?:\/\//, ""))}</div>` : ""}
        </div>
        ${e.twofa === "あり" ? `<span class="badge-2fa">2FA</span>` : ""}
        <svg class="chevron" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 4l4 4-4 4"/>
        </svg>
      </div>
      <div class="card-body">
        ${e.url ? `<div class="field"><span class="field-label">URL</span><span class="field-val" style="color:#6b9fd4;font-size:12px">${esc(e.url)}</span></div>` : ""}
        ${e.user ? `<div class="field"><span class="field-label">ユーザー</span><span class="field-val">${esc(e.user)}</span><button class="copy-btn" onclick="copyVal('${e.id}','user',this)">コピー</button></div>` : ""}
        ${e.pw ? `<div class="field"><span class="field-label">パスワード</span><span class="field-val">${esc(e.pw)}</span><button class="copy-btn" onclick="copyVal('${e.id}','pw',this)">コピー</button></div>` : ""}
        ${e.twofa ? `<div class="field"><span class="field-label">2FA</span><span class="field-val serif">${esc(e.twofa)}</span></div>` : ""}
        ${e.author ? `<div class="field"><span class="field-label">担当</span><span class="field-val serif">${esc(e.author)}</span></div>` : ""}
        ${e.note ? `<div class="field"><span class="field-label">備考</span><span class="field-val note">${esc(e.note)}</span></div>` : ""}

      </div>
    </div>
  `).join("");
}

function esc(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toggle(id) {
  const c = document.getElementById("card-" + id);
  c.classList.toggle("open");
}

function togglePw(id) {
  pwVisible[id] = !pwVisible[id];
  render();
  const card = document.getElementById("card-" + id);
  if (card) card.classList.add("open");
}

function copyVal(id, field, btn) {
  const e = data.find(x => x.id == id);
  if (!e) return;
  const text = field === "pw" ? e.pw : e.user;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "コピー"; btn.classList.remove("copied"); }, 1800);
  });
}
